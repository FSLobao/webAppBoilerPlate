[project]
name = "webapp-boilerplate"
version = "0.1.0"
description = "Workspace root: shared tooling configuration for the boilerplate Python packages."
requires-python = ">=3.13"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["webapp/backend"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
  "E", "W",
  "F",
  "I",
  "D",
  "UP",
  "B",
  "S",
  "DTZ",
  "ASYNC",
  "C4", "SIM", "PT", "RUF",
  "G",
  "T20",
  "ERA",
]
ignore = [
  "D107",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["webapp_api"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["D", "S101", "S105", "S106"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
  "fastapi.Depends", "fastapi.Security", "fastapi.Query",
  "fastapi.Path", "fastapi.Header", "fastapi.Body", "fastapi.File",
]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["webapp/backend/tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
