# webapp routes on the shared application proxy.
# /webapp/files/ is served from the webapp-images volume (read-only); everything
# else under /webapp/ goes to the webapp pod, which serves both the API and the SPA.

location = /webapp {
    return 301 /webapp/;
}

# Temporary upload files start with a dot; never serve them, nor the directory.
location ~ ^/webapp/files/(\.|$) {
    return 404;
}

location /webapp/files/ {
    alias /srv/webapp/images/;
    autoindex off;
    limit_except GET {
        deny all;
    }
    # Profile photos are personal data: browsers revalidate (ETag) on every use, so a
    # replaced or deleted photo stops being shown.
    add_header Cache-Control "private, no-cache";
    add_header X-Content-Type-Options nosniff always;
}

location /webapp/api/ {
    set $webapp_upstream http://webapp.dns.podman:8000;
    proxy_pass $webapp_upstream;
    # API image limit is 5 MiB; leave room for multipart overhead.
    client_max_body_size 6m;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /webapp/ {
    set $webapp_upstream http://webapp.dns.podman:8000;
    proxy_pass $webapp_upstream;
    proxy_set_header Host $host;
}
