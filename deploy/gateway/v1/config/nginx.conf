worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 443 ssl;
        server_name headscale.example.invalid;

        ssl_certificate /etc/gateway-vpn/tls/fullchain.pem;
        ssl_certificate_key /etc/gateway-vpn/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        add_header Access-Control-Allow-Origin "https://dev-gateway.dev.anatel" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Origin, X-Requested-With" always;
        add_header Access-Control-Max-Age "100" always;
        add_header Vary "Origin" always;

        location / {
            if ($request_method = OPTIONS) {
                return 204;
            }

            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
        }
    }

    server {
        listen 443 ssl;
        server_name dev-gateway.dev.anatel;

        ssl_certificate /etc/gateway-vpn/tls/fullchain.pem;
        ssl_certificate_key /etc/gateway-vpn/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        allow 100.64.0.0/10;
        deny all;

        location = /admin {
            proxy_pass http://127.0.0.1:3000/admin/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        location /admin/ {
            proxy_pass http://127.0.0.1:3000/admin/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        location / {
            return 404;
        }
    }
}