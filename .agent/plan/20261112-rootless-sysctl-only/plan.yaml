tldr: |
  Add --sysctl-only to the existing host-preparation script using its current sysctl
  implementation, with read-before-mutation preflight and best-effort rollback. Add
  isolated shell behavior tests and update the CLI-facing README and rootless recipe.
  Complete an independent architecture-focused review after implementation and docs.
