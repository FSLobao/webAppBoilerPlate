baseline:
  objective: "Add --sysctl-only to prepare-rootless-host.sh; test it safely and update README and the rootless recipe."
  acceptance_criteria:
    - "`--sysctl-only` writes only `/etc/sysctl.d/90-rootless-ports.conf` as `net.ipv4.ip_unprivileged_port_start=443\\n` with mode `0644`, applies it through the existing `sysctl -p` path, and verifies the runtime value is `443`."
    - "Its dispatch path does not call `preflight`, firewall inspection/mutation helpers, SELinux inspection/mutation helpers, or `systemctl`."
    - "Root, sysctl-specific commands, `/etc/sysctl.d`, the target path type, the current runtime value, and existing file contents/mode are checked before any persistent or runtime mutation."
    - "All inputs, prerequisites, and rollback state (target-file presence, contents, mode, and current runtime value) are read before mutation. Preflight/read failure guarantees the target file and runtime value remain unchanged. After a config/runtime mutation starts, failure triggers best-effort restoration of the previous file presence/content/mode and runtime value where feasible; restoration failures are reported. Absolute rollback cannot be guaranteed under OS, filesystem, or kernel failures."
    - "Repeated successful runs converge to the same exact content, mode, and runtime setting. Existing no-argument apply, `--check`, and help continue to work with their existing success/error conventions."
    - "Tests use disposable state and safe command fakes; they do not alter host sysctls, SELinux, firewall state, or services and introduce no dependency."
    - "Documentation clearly distinguishes the isolated sysctl mode from broad legacy apply, and separately preserves the architecture's SELinux and external-firewall requirements for deployment."
  captured_at: "2026-11-12T11:49:30.312+01:00"

