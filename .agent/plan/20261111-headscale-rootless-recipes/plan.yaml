      existing write-enabled custom-agent definitions that currently declare
      the `edit` alias without that concrete tool. Use the existing Janitor
      definition as the repository precedent; do not change unrelated
      permissions or agent behavior.
    wave: 1
    depends_on: []
    agent: Universal Janitor
    status: completed
    retries_used: 0
    acceptance_criteria:
      - "Add `edit/editFiles` to the tools lists in exactly gem-architect.agent.md, coder.agent.md, gem-implementer.agent.md, gem-skill-creator.agent.md, gem-code-simplifier.agent.md, gem-debugger.agent.md, gem-designer.agent.md, gem-devops.agent.md, gem-documentation-writer.agent.md, gem-orchestrator.agent.md, gem-planner.agent.md, and planner.agent.md."
      - "Preserve every pre-existing tool entry and all unrelated file content in those definitions; make no other permission, description, model, or behavior changes."
      - "Leave gem-reviewer.agent.md, reviewer.agent.md, coordinator.agent.md, gem-researcher.agent.md, gem-browser-tester.agent.md, and gem-mobile-tester.agent.md unchanged; do not grant edit access to read-only or test-only agents."
      - "All 12 changed tool lists remain valid frontmatter and contain the concrete editor exactly once; janitor.agent.md remains the unchanged precedent."
    handoff:
      constraints:
        - "Use approved file-edit tooling only; do not use shell-based file writes."
        - "Limit edits to adding `edit/editFiles` in the specified tools lists; preserve all existing permissions and unrelated user changes."
        - "Do not add `execute` or any other tool to a definition that did not already have it."
      relevant_context:
        - ".github/agents/janitor.agent.md already declares `edit/editFiles` and is the concrete-tool precedent."
        - ".github/agents/gem-architect.agent.md, coder.agent.md, gem-implementer.agent.md, gem-skill-creator.agent.md, gem-code-simplifier.agent.md, gem-debugger.agent.md, gem-designer.agent.md, gem-devops.agent.md, gem-documentation-writer.agent.md, gem-orchestrator.agent.md, gem-planner.agent.md, and planner.agent.md currently declare the `edit` alias without the concrete editor."
