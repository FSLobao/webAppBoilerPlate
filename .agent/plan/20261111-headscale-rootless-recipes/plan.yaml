      - "The rootless page uses Brazilian Portuguese, a first-rendered collapsible index synchronized with all top-level sections, valid heading hierarchy, and the guide's responsive return-to-top block at each section end."
      - "Each procedural step has one purpose, no more than five commands, and the guide's objective, context when applicable, copy-ready language-tagged commands, expected output, and success verification; non-verified behavior is labeled rather than asserted."
